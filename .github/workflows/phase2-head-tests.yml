name: Phase 2 head-only tests (no upload)
on:
  push:
    branches: [phase2/shipping-metadata-preview-20261104]
permissions:
  contents: read
concurrency:
  group: phase2-head-only-tests
  cancel-in-progress: true
jobs:
  verify-head:
    if: github.repository == 'offerte4zampe/offerte4zampe' && github.ref == 'refs/heads/phase2/shipping-metadata-preview-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local test tools
        run: |
          python -m pip install Pillow==12.3.0
          npm install --prefix "$RUNNER_TEMP/phase2-tools" wrangler@4.154.0
      - name: Build locally without any remote upload
        run: '"$RUNNER_TEMP/phase2-tools/node_modules/.bin/wrangler" deploy --dry-run --config wrangler.phase2-preview.jsonc --outdir "$RUNNER_TEMP/phase2-bundle"'
      - name: Complete Python suite
        run: python -m unittest discover -s tests
      - name: Complete Node suite including 610 equivalence cases
        run: node --test tests/test_*.mjs
      - name: Local workerd shipping matrix
        run: python automation/verify_d1_staging.py --wrangler "$RUNNER_TEMP/phase2-tools/node_modules/.bin/wrangler"
