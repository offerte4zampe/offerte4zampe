name: Refresh real merchant catalogs
# Hygge Awin feed refresh uses the HYGGE_AWIN_FEED_URL Actions secret.
on:
  schedule:
    - cron: '12 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'automation/image_policy.py'
      - 'automation/image-rights.json'
      - 'automation/cache_product_images.py'
      - 'automation/import_partner_feed.py'
      - 'automation/hygge_awin_feed.py'
      - 'automation/hygge-snapshot.json'
      - 'tests/test_hygge_awin_feed.py'
      - 'automation/bauzaar_feed.py'
      - 'automation/isola_feed.py'
      - 'automation/paco_feed.py'
      - 'tests/test_paco_feed.py'
      - 'tests/test_isola_feed.py'
      - 'automation/shipping_metadata.py'
      - 'tests/test_bauzaar_feed.py'
      - 'tests/test_partner_feed.py'
      - 'automation/update_catalog.py'
      - 'automation/enrich_catalog.py'
      - 'automation/build_product_catalog.py'
      - 'automation/merchant_promotions.py'
      - 'tests/test_merchant_promotions.py'
      - 'tests/test_merchant_promotions.mjs'
      - 'automation/name_matching.py'
      - 'automation/build_priority_products.py'
      - 'tests/test_priority_products.py'
      - 'automation/brand_aliases.json'
      - 'automation/apply_canonical_products.py'
      - 'tests/test_product_catalog.py'
      - 'automation/package_integrity.py'
      - 'automation/audit_store_integrity.py'
      - 'tests/test_store_integrity.py'
      - 'automation/reviewed_identity.py'
      - 'automation/reviewed-identities.json'
      - 'tests/test_reviewed_identity.py'
      - 'automation/normalize_catalog.cjs'
      - 'site/assets/catalog-metadata.js'
      - 'automation/guard_catalog.py'
      - 'automation/check_merchant_links.py'
      - 'tests/test_link_health.py'
      - 'automation/build_corrections_page.py'
      - 'automation/build_savings_guides.py'
      - 'automation/build_observatory.py'
      - 'automation/audit_site.py'
      - 'tests/test_static_site_audit.py'
      - 'tests/test_observatory.py'
      - 'tests/test_savings_guides.py'
      - 'automation/corrections.json'
      - 'tests/test_catalog_guard.py'
      - 'automation/update_history.py'
      - 'automation/build_category_pages.py'
      - 'automation/build_product_pages.py'
      - 'automation/build_home_data.py'
      - 'automation/build_product_metadata.py'
      - 'tests/test_product_metadata.py'
      - 'automation/build_catalog_preview.py'
      - 'automation/build_catalog_index.py'
      - 'automation/product_link.py'
      - 'tests/test_canonical_redirects.mjs'
      - 'tests/test_catalog_preview.py'
      - 'tests/test_search_index.py'
      - 'tests/test_home_data.py'
      - 'tests/test_search_suggest.mjs'
      - 'automation/build_matched_pages.py'
      - 'automation/apply_social_metadata.py'
      - 'automation/improve_discovery.py'
      - 'tests/test_discovery.py'
      - 'automation/apply_navigation.py'
      - 'automation/partials/header.html'
      - 'automation/partials/footer.html'
      - 'automation/partials/social-home.html'
      - 'site/assets/style.css'
      - 'tests/test_social_links.py'
      - 'automation/route_product_links.py'
      - 'tests/test_product_routing.py'
      - 'automation/remove_unverified_ads.py'
      - 'tests/test_ad_loader.py'
      - 'tests/test_navigation.py'
      - 'automation/build_sitemaps.py'
      - 'automation/build_brand_pages.py'
      - 'automation/brand_landings.py'
      - 'automation/apply_brand_links.py'
      - 'automation/build_line_pages.py'
      - 'automation/build_commercial_lines.py'
      - 'tests/test_commercial_lines.py'
      - 'tests/test_line_pages.py'
      - 'automation/list_schema.py'
      - 'automation/report_link.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests
      - run: python automation/check_d1_activation.py --prepare-build
      - run: node --test tests/test_canonical_redirects.mjs tests/test_outbound.mjs tests/test_metrics.mjs tests/test_trade.mjs tests/test_report.mjs tests/test_basket.mjs tests/test_daily_cost.mjs tests/test_price_history.mjs tests/test_search_suggest.mjs tests/test_catalog_metadata.mjs tests/test_watchlist.mjs
      - run: python automation/build_priority_products.py
      - name: Refresh catalogs including Hygge Awin
        env:
          HYGGE_AWIN_FEED_URL: ${{ secrets.HYGGE_AWIN_FEED_URL }}
        run: python automation/update_catalog.py
      - name: Require Hygge offer import before publishing
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          catalog = json.loads(gzip.decompress(Path('site/data/catalog.json.gz').read_bytes()))
          sources = [s for s in catalog['sources'] if s['id'] == 'hygge']
          offers = [o for o in catalog['offers'] if o['merchant_id'] == 'hygge']
          assert len(sources) == 1 and sources[0]['status'] == 'ok' and len(offers) >= 100, (
              'Hygge feed unavailable or incomplete; refusing to publish an incomplete catalog'
          )
          print(f'Validated {len(offers)} Hygge offers.')
          PY
      - run: python automation/enrich_catalog.py
      - run: node automation/normalize_catalog.cjs
      - run: python automation/check_merchant_links.py
      - run: python automation/guard_catalog.py
      - run: python automation/audit_store_integrity.py
      - run: python automation/update_history.py
      - run: python automation/build_product_catalog.py
      - run: python automation/cache_product_images.py
      - run: python automation/build_product_catalog.py
      - run: python automation/build_catalog_index.py
      - run: python automation/build_priority_products.py
      - run: python automation/build_category_pages.py
      - run: python automation/build_product_pages.py
      - run: python automation/build_matched_pages.py
      - run: python automation/build_line_pages.py
      - run: python automation/build_commercial_lines.py
      - run: python automation/build_brand_pages.py
      - run: python automation/build_home_data.py
      - run: python automation/apply_brand_links.py
      - run: python automation/build_product_metadata.py
      - run: python automation/apply_product_metadata.py
      - run: python automation/build_catalog_preview.py
      - run: python automation/build_corrections_page.py
      - run: python automation/build_savings_guides.py
      - run: python automation/build_observatory.py
      - run: python automation/apply_social_metadata.py
      - run: python automation/apply_compact_comparator.py
      - run: python automation/apply_navigation.py
      - run: python automation/route_product_links.py
      - run: python automation/remove_unverified_ads.py
      - run: python automation/improve_discovery.py
      - run: python automation/apply_canonical_products.py
      - run: python automation/apply_semantics.py
      - run: python automation/build_sitemaps.py
      - run: python automation/audit_site.py
      - name: Verify matching offer timestamps across home and product details
        run: python tests/test_offer_snapshot_consistency.py
      - name: Publish refreshed catalog
        run: |
          # Keep generated outputs isolated from concurrent source changes.
          BASE_SHA="$(git rev-parse HEAD)"
          if ! git diff --quiet -- site/data/catalog-index.json site/data/catalog-index site/data/catalog.json.gz site/data/site-quality.json site/data/discovery.json site/data/price-observatory.json site/data/price-history.json.gz site/data/history site/data/catalog-quality.json site/data/catalog-quarantine.json site/data/home.json site/data/search-index.json site/data/product-meta site/data/canonical-products site/data/canonical-routes site/data/canonical-route-list.json site/data/canonical-sitemap.json site/data/product-catalog.json.gz site/data/product-coverage.json site/data/matching-candidates.json automation/product-registry.json site/_redirects site/data/store-audit.json automation/store-verification-cache.json site/data/link-health.json automation/link-health-cache.json automation/identifier-cache.json automation/shipping-cache.json site/*.html site/sitemap*.xml automation/sitemap-state.json; then
            git config user.name "Offerte4Zampe catalog bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/brand-redirects.json site/data/brand-pages.json site/data/catalog-index.json site/data/catalog-index site/data/product-images.json site/data/priority-products.json site/data/catalog.json.gz site/data/site-quality.json site/data/discovery.json site/data/price-observatory.json site/data/price-history.json.gz site/data/history site/data/catalog-quality.json site/data/catalog-quarantine.json site/data/home.json site/data/search-index.json site/data/product-meta site/data/canonical-products site/data/canonical-routes site/data/canonical-route-list.json site/data/canonical-sitemap.json site/data/product-catalog.json.gz site/data/product-coverage.json site/data/matching-candidates.json automation/product-registry.json site/_redirects site/data/store-audit.json automation/store-verification-cache.json site/data/link-health.json automation/link-health-cache.json automation/identifier-cache.json automation/shipping-cache.json site/*.html site/sitemap*.xml automation/sitemap-state.json
            if [ -d site/img/p ]; then git add site/img/p; fi
            if git diff --cached --quiet; then
              echo "No staged catalog changes."
              exit 0
            fi
            git commit -m "chore: refresh real merchant prices"
            # Replay only the generated snapshot commit. Abort on changed build
            # sources or overlapping generated files; never force-push or choose
            # a side automatically when a conflict occurs.
            for attempt in 1 2 3; do
              git fetch origin main
              if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
                if ! git diff --quiet "$BASE_SHA" origin/main -- automation .github/workflows site/assets tests; then
                  echo "::error::Build sources changed during generation; rerun from latest main."
                  exit 1
                fi
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "::error::Generated files conflict with newer main; regenerate from latest main."
                  exit 1
                fi
              fi
              if git push origin HEAD:main; then
                echo "Catalog published and pushed to main."
                exit 0
              fi
              echo "Main moved during push; retrying after fetching changes."
            done
            echo "::error::Catalog was not published after three safe attempts."
            exit 1
          fi
