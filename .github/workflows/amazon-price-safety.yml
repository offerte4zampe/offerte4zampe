name: Amazon price-feature safety (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/index.mjs'
      - 'worker/canonical-product.mjs'
      - 'site/assets/price-history.js'
      - 'site/assets/watchlist.js'
      - 'site/assets/product.js'
      - 'site/assets/product-metadata.js'
      - 'site/data/amazon-links.json'
      - 'automation/price_feature_gate.py'
      - 'automation/audit_price_feature_build.py'
      - 'worker/amazon-product.mjs'
      - 'tests/check_amazon_generated_local.mjs'
      - 'tests/test_telegram.mjs'
      - 'automation/update_history.py'
      - 'automation/build_observatory.py'
      - 'tests/test_price_feature*'
      - 'tests/test_amazon_links.mjs'
      - 'tests/amazon_*'
      - 'wrangler.jsonc'
      - '.github/workflows/amazon-price-safety.yml'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare local D1 validation fixture without activating D1
        run: python automation/check_d1_activation.py --prepare-build
      - name: Complete Node unit regression suite
        run: node --test tests/test_*.mjs tests/amazon_*.test.cjs
  workerd-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler into isolated tools directory
        run: npm install --prefix "$RUNNER_TEMP/workerd-check" wrangler@4.154.0
      - name: Validate Worker bundle and deploy asset exclusion without deploying
        env:
          PRICE_TRACKING_ENABLED: 'false'
        run: '"$RUNNER_TEMP/workerd-check/node_modules/.bin/wrangler" deploy --dry-run --outdir "$RUNNER_TEMP/amazon-price-check"'
      - name: Scan actual generated assets for disabled features
        if: always()
        run: python automation/audit_price_feature_build.py --site site --output "$RUNNER_TEMP/amazon-local/price-content-audit.json"
      - name: Install pinned local screenshot driver
        if: success()
        run: npm install --prefix "$RUNNER_TEMP/amazon-puppeteer" puppeteer-core@25.14.0
      - name: Verify generated local site with real Worker handler, zero network publishing
        if: success()
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PUPPETEER_ROOT: ${{ runner.temp }}/amazon-puppeteer
          AMAZON_REPORT_DIR: ${{ runner.temp }}/amazon-local/screenshots
        run: node tests/check_amazon_generated_local.mjs
      - name: Upload offline audit and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-price-safety-local-evidence
          path: ${{ runner.temp }}/amazon-local/
          retention-days: 14
          if-no-files-found: warn
