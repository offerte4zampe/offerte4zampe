name: Amazon price-feature safety (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/index.mjs'
      - 'worker/canonical-product.mjs'
      - 'site/assets/price-history.js'
      - 'site/assets/watchlist.js'
      - 'site/assets/product.js'
      - 'site/assets/product-metadata.js'
      - 'site/data/amazon-links.json'
      - 'automation/price_feature_gate.py'
      - 'automation/update_history.py'
      - 'automation/build_observatory.py'
      - 'tests/test_price_feature*'
      - 'tests/test_amazon_links.mjs'
      - 'tests/amazon_*'
      - 'wrangler.jsonc'
      - '.github/workflows/amazon-price-safety.yml'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete Node unit regression suite
        run: node --test tests/test_*.mjs tests/amazon_*.test.cjs
  workerd-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler into isolated tools directory
        run: npm install --prefix "$RUNNER_TEMP/workerd-check" wrangler@4.154.0
      - name: Validate Worker bundle and deploy asset exclusion without deploying
        env:
          PRICE_TRACKING_ENABLED: 'false'
        run: '"$RUNNER_TEMP/workerd-check/node_modules/.bin/wrangler" deploy --dry-run --outdir "$RUNNER_TEMP/amazon-price-check"'
