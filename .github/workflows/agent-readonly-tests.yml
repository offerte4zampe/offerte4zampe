name: Agent read-only tests
on:
  pull_request:
    paths:
      - 'automation/agent/**'
      - '.github/workflows/agent-readonly-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline planner and MCP handshake
        run: node --test automation/agent/*.test.mjs
