name: Amazon merchant history isolation (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/price_merchant_policy.py'
      - 'automation/update_history.py'
      - 'automation/build_product_catalog.py'
      - 'automation/build_home_data.py'
      - 'automation/build_observatory.py'
      - 'worker/price-merchant-policy.mjs'
      - 'worker/canonical-product.mjs'
      - 'worker/notification-plan.mjs'
      - 'site/assets/price-history.js'
      - 'tests/test_amazon_history_isolation*'
      - '.github/workflows/amazon-merchant-isolation.yml'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate local D1 validation fixture only (no D1 activation)
        run: python automation/check_d1_activation.py --prepare-build
      - run: node --test tests/test_*.mjs tests/amazon_*.test.cjs
  workerd-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare disposable validation inputs (D1 remains off)
        run: python automation/check_d1_activation.py --prepare-build
      - run: npm install --prefix "$RUNNER_TEMP/o4z-verify" wrangler@4.154.0
      - name: Compile Worker and generated assets without deploying
        env:
          PRICE_TRACKING_ENABLED: 'false'
        run: '"$RUNNER_TEMP/o4z-verify/node_modules/.bin/wrangler" deploy --dry-run --outdir "$RUNNER_TEMP/o4z-history-dry-run"'
