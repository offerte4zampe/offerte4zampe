name: Telegram live health
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-live-health.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public worker status and feed without credentials
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,datetime,pathlib
          base="https://offerte4zampe.it"
          results={"checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          for path in ["/api/telegram/status","/data/telegram-amazon.json"]:
              url=base+path
              req=urllib.request.Request(url,headers={"User-Agent":"Offerte4Zampe-Telegram-Health/1.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      status=r.status
                      data=r.read(200000)
                      ctype=r.headers.get("Content-Type","")
                  print(f"{path}: http={status}, content_type={ctype}, bytes={len(data)}")
                  parsed=json.loads(data)
                  results[path]={"http":status}
                  if path.endswith("/status"):
                      allowed=["integration","content_mode","amazon_owner_enabled","configured","token_present","channel_present","channel_matches","last_sent_day","last_publication","halted"]
                      safe={k:parsed.get(k) for k in allowed}
                      results[path]["status"]=safe
                      print("worker_status="+json.dumps(safe,ensure_ascii=False))
                      if parsed.get("content_mode")!="amazon_only":
                          print("::warning::Deployed Worker not in amazon_only mode")
                      if not parsed.get("configured"):
                          print("::warning::Telegram bot/channel not configured in deployed Worker")
                      if parsed.get("halted"):
                          print("::warning::Telegram Durable Object is halted")
                  else:
                      offers=parsed.get("offers",[])
                      results[path]["offer_count"]=len(offers)
                      print("feed_offer_count="+str(len(offers)))
                      results[path]["asins"]=[o.get("asin") for o in offers if isinstance(o,dict)]
                      print("feed_asins="+json.dumps(results[path]["asins"]))
              except (Exception,) as e:
                  print(f"::error::{path}: {type(e).__name__} {str(e)[:250]}")
                  raise SystemExit(1)
          pathlib.Path("automation/telegram-live-health-result.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\\n",encoding="utf8")
          PY
      - name: Save redacted health result to repository
        shell: bash
        run: |
          git config user.name "Offerte4Zampe diagnostics"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/telegram-live-health-result.json
          git commit -m "chore: record Telegram live deployment status" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
