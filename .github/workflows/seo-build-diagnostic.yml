name: Read-only SEO release build diagnosis
on:
  push:
    branches: [ops/seo-build-readonly-diagnostic]
    paths: [.github/workflows/seo-build-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read Cloudflare build metadata and classify errors without raw logs
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_MCP_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,re
          token=os.environ.get('CF_TOKEN','')
          if not token:
              print('BUILD_DIAG missing_existing_token')
              raise SystemExit(1)
          base='https://api.cloudflare.com/client/v4/accounts/a1f3484deccc82aa8aedb784816b0173/builds/builds/c600020f-a73a-43e2-9cbe-62a554a0a559'
          for suffix in ['', '/logs']:
              request=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      data=json.load(response)
              except urllib.error.HTTPError as error:
                  print('BUILD_DIAG',suffix or 'metadata','http',error.code)
                  continue
              result=data.get('result') or {}
              if not suffix:
                  safe={k:result.get(k) for k in ('status','build_outcome','created_on','started_on','stopped_on')}
                  print('BUILD_DIAG metadata',json.dumps(safe))
              else:
                  text='\n'.join(str(line[-1]) for line in result.get('lines',[]) if isinstance(line,list) and line)
                  patterns={'quota':r'quota|build minutes|limit exceeded','auth':r'unauthori[sz]ed|authentication|invalid.*token|expired.*token','permission':r'permission|access denied','repository':r'repository not found|clone.*fail','dependency':r'module.*not found|could not find|no matching distribution','source':r'syntaxerror|traceback|referenceerror','branch':r'branch.*not|branch.*disabl','build_command':r'build command|exit code|command failed'}
                  print('BUILD_DIAG log_categories',json.dumps({k:bool(re.search(p,text,re.I)) for k,p in patterns.items()}))
                  print('BUILD_DIAG log_count',len(result.get('lines',[])))
          PY
