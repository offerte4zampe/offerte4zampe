name: Cloudflare MCP connection check (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-mcp-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secret is configured
        env:
          HAS_MCP_TOKEN: ${{ secrets.CLOUDFLARE_MCP_TOKEN != '' }}
        run: |
          if [ "$HAS_MCP_TOKEN" != "true" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_MCP_TOKEN. Create a least-privilege Cloudflare token and store it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Run local unit tests first
        run: node --test automation/agent/*.test.mjs
      - name: Probe official MCP initialize endpoint only
        env:
          CLOUDFLARE_MCP_TOKEN: ${{ secrets.CLOUDFLARE_MCP_TOKEN }}
        run: node automation/agent/cloudflare-mcp-probe.mjs
