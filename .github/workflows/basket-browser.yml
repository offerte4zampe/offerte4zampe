      - 'automation/build_catalog_preview.py'
      - 'automation/product_link.py'
      - 'tests/test_canonical_redirects.mjs'
      - 'tests/test_catalog_preview.py'
      - 'tests/test_navigation.py'
      - 'tests/test_static_site_audit.py'
      - 'tests/test_observatory.py'
      - '.github/workflows/basket-browser.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare denied-by-default build attestation
        run: python automation/check_d1_activation.py --prepare-build
      - name: Test basket and pricing invariants
        run: node --test tests/test_canonical_redirects.mjs tests/test_outbound.mjs tests/test_shipping_source.mjs tests/test_shipping_migration.mjs tests/test_canonical_product.mjs tests/test_seasonal_theme.mjs tests/test_watchlist.mjs tests/test_catalog_metadata.mjs tests/test_basket.mjs tests/test_trade.mjs tests/test_report.mjs tests/test_metrics.mjs tests/test_daily_cost.mjs tests/test_price_history.mjs tests/test_notification_plan.mjs tests/test_newsletter_ui.mjs tests/test_search_suggest.mjs tests/test_product_view.mjs tests/test_amazon_links.mjs tests/test_catalog_prepare.mjs tests/test_product_share.mjs tests/test_product_preview.mjs tests/test_catalog_cooperate.mjs tests/test_catalog_load.mjs tests/test_catalog_index.mjs
      - run: python -m pip install Pillow==12.3.0
      - name: Test schema and generators without external services
        run: python -m unittest discover -s tests
      - name: Reconcile selling packs and replay independent store evidence
        run: |
          ENRICH_LIMIT=0 python automation/enrich_catalog.py
          python automation/audit_store_integrity.py --offline
          node automation/normalize_catalog.cjs
          python automation/build_product_catalog.py
      - name: Generate compact search index locally
        run: python automation/build_home_data.py
      - name: Generate title-only social metadata locally
        run: python automation/build_product_metadata.py
      - name: Generate catalog preview locally
        run: python automation/build_catalog_preview.py
      - name: Generate local observed history shards
        run: python automation/update_history.py
      - name: Generate current catalog guides locally
        run: |
          python automation/build_matched_pages.py
          python automation/build_savings_guides.py
      - name: Generate curated line page locally
        run: python automation/build_line_pages.py
      - name: Generate monthly observatory locally
        run: python automation/build_observatory.py
      - name: Generate tested coupon page
        run: python automation/build_coupon_page.py
      - name: Normalize primary navigation
        run: python automation/apply_navigation.py
      - name: Route product links through comparison
        run: python automation/route_product_links.py
      - name: Remove unverified automatic ad loader
        run: python automation/remove_unverified_ads.py
      - name: Generate crawlable canonical discovery links
        run: python automation/improve_discovery.py
      - name: Audit generated static pages
        run: |
          python automation/apply_compact_comparator.py
          python automation/audit_site.py
      - name: Install pinned browser driver
        run: npm install --prefix "$RUNNER_TEMP/basket-browser" puppeteer-core@25.14.0
      - name: Test isolated mobile basket
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          export PUPPETEER_ROOT="$RUNNER_TEMP/basket-browser"
          python automation/build_brand_pages.py
          python automation/apply_brand_links.py
          python automation/apply_product_metadata.py
          python automation/apply_compact_comparator.py
          python automation/apply_navigation.py
          python automation/apply_freshness.py
          python automation/clean_urls.py
          python automation/apply_micro_fixes.py
          python automation/apply_images.py
          python automation/apply_semantics.py
          python automation/remove_unverified_ads.py
          python automation/build_catalog_index.py
          python automation/fingerprint_assets.py
          node tests/check_basket_browser.mjs
      - name: Verify exact SiteStripe product pages on mobile and desktop
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PUPPETEER_ROOT: ${{ runner.temp }}/basket-browser
        run: node tests/check_sitestripe_local.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basket-mobile-smoke
          path: browser-reports/
          if-no-files-found: warn
          retention-days: 14
