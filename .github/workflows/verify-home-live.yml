name: Verify public homepage release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-home-live.yml', 'site/assets/style.css', 'site/index.html', 'site/assets/base.js', 'site/assets/seasonal-theme.mjs', 'site/assets/seasonal-theme.css', 'site/assets/black-week-hero.svg', 'site/assets/christmas-hero.svg']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare repository snapshot to live website
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, re, time
          from pathlib import Path
          expected = json.loads(Path("site/data/home.json").read_text())
          chosen = expected.get("daily_pick_id")
          print(json.dumps({"expected_generated_at":expected.get("generated_at"),"expected_daily_pick_id":chosen,"expected_comparisons":sum("comparison_savings_pct" in o for o in expected.get("offers",[]))}))
          for path in ["/", "/data/home.json"]:
              url = "https://offerte4zampe.it" + path
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Offerte4Zampe-Public-Release-Check/1.0","Accept":"text/html,application/json"})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      status=response.status
                      raw=response.read(3500000)
                  if path=="/":
                      doc=raw.decode("utf-8","replace")
                      checks={"daily_label":"id=\"daily-pick-label\"".replace("\\","") in doc and "OFFERTA DEL GIORNO" in doc,
                              "price_badge":"savings-badge" in doc,
                              "selected_offer":bool(chosen and chosen in doc)}
                  else:
                      payload=json.loads(raw)
                      checks={"generated_at_matches":payload.get("generated_at")==expected.get("generated_at"),
                              "daily_pick_matches":payload.get("daily_pick_id")==chosen,
                              "comparison_count":sum("comparison_savings_pct" in o for o in payload.get("offers",[]))}
                  print(json.dumps({"path":path,"status":status,**checks},ensure_ascii=False))
                  if path=="/" and not all(checks.values()):
                      print("::warning::Public homepage differs from current GitHub snapshot.")
                  if path!="/" and not (checks.get("generated_at_matches") and checks.get("daily_pick_matches")):
                      print("::warning::Public homepage JSON differs from current GitHub snapshot.")
              except urllib.error.HTTPError as e:
                  print(json.dumps({"path":path,"http_status":e.code,"verification":"blocked_or_unavailable"}))
                  print("::warning::Live check could not read the URL.")
              except Exception as e:
                  print(json.dumps({"path":path,"verification":"network_or_parse_error","kind":type(e).__name__}))
                  print("::warning::Live check incomplete.")
          PY

      - name: Verify published feature CSS
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          url='https://offerte4zampe.it/assets/style.css'
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'Offerte4Zampe-Public-Release-Check/1.0'})
              with urllib.request.urlopen(request,timeout=15) as response:
                  content=response.read(500000).decode('utf-8','replace')
              checks={
                  'spotlight_big_layout':'.daily-pick .spotlight-product.has-price-proof' in content,
                  'large_price':'font-size:clamp(36px,4vw,50px)' in content,
                  'responsive_mobile':'@media(max-width:520px)' in content,
                  'reduced_motion':'prefers-reduced-motion:reduce' in content
              }
              print(json.dumps({'css_url':url,'checks':checks}))
              if not all(checks.values()):
                  print('::warning::Latest daily offer CSS is not yet visible on public site.')
          except urllib.error.HTTPError as err:
              print(json.dumps({'css_url':url,'http_status':err.code,'verification':'unavailable'}))
              print('::warning::Public CSS check blocked by HTTP error.')
          except Exception as err:
              print(json.dumps({'css_url':url,'verification':'unavailable','kind':type(err).__name__}))
              print('::warning::Public CSS check failed.')
          PY

      - name: Check public seasonal assets (read-only)
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          for name,marker in [
              ('seasonal-theme.mjs','black-week-hero.svg'),
              ('seasonal-theme.css','o4z-season-visual'),
              ('base.js','seasonal-theme.mjs'),
              ('black-week-hero.svg','Black Week a quattro zampe'),
              ('christmas-hero.svg','Natale a quattro zampe')]:
              url='https://offerte4zampe.it/assets/'+name
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Offerte4Zampe-Public-Release-Check/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      body=response.read(150000).decode('utf-8','replace')
                      status=response.status
                  visible=status==200 and marker in body
                  print(json.dumps({'asset':name,'status':status,'expected_content_visible':visible}))
                  if not visible:print('::warning::Seasonal asset is not yet deployed')
              except urllib.error.HTTPError as e:
                  print(json.dumps({'asset':name,'http_status':e.code,'result':'blocked_or_not_published'}))
                  print('::warning::Seasonal asset inaccessible from GitHub runner')
              except Exception as e:
                  print(json.dumps({'asset':name,'result':'unavailable','kind':type(e).__name__}))
                  print('::warning::Seasonal asset verification unavailable')
          PY
