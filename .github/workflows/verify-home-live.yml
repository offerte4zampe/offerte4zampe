name: Verify public homepage release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-home-live.yml', 'site/data/home.json', 'site/assets/style.css', 'site/index.html', 'site/assets/base.js', 'site/assets/seasonal-theme.mjs', 'site/assets/seasonal-theme.css', 'site/assets/black-week-hero.svg', 'site/assets/christmas-hero.svg']
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh real merchant catalogs', 'Refresh tested coupon page']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha precedes the generated snapshot pushed by the producer.
          # Check current main; manual/push runs retain their exact triggering commit.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Require published homepage to match repository (retry during deployment)
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          import time
          import urllib.request
          from pathlib import Path

          expected = json.loads(Path("site/data/home.json").read_text())
          generated = expected.get("generated_at")
          chosen = expected.get("daily_pick_id")
          selected = next((o for o in expected.get("offers", []) if o.get("id") == chosen), None)
          expected_comparisons = sum("comparison_savings_pct" in offer for offer in expected.get("offers", []))
          if not generated or not chosen or not selected or not selected.get("product_url"):
              print("::error::Repository home.json is missing generated_at or a valid daily pick.")
              sys.exit(1)

          def fetch(path):
              request = urllib.request.Request(
                  "https://offerte4zampe.it" + path,
                  headers={
                      "User-Agent": "Offerte4Zampe-Public-Release-Check/1.0",
                      "Cache-Control": "no-cache",
                      "Accept": "text/html,application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return response.read(3500000)

          # A catalog commit can arrive before Cloudflare finishes deploying.
          # Give the public site a bounded grace period, then fail visibly.
          for attempt in range(1, 13):
              try:
                  html = fetch("/").decode("utf-8", "replace")
                  public = json.loads(fetch("/data/home.json"))
                  checks = {
                      "html_generated_at": re.search(r'data-home-generated="([^"]+)"', html).group(1) == generated
                          if re.search(r'data-home-generated="([^"]+)"', html) else False,
                      "daily_label": 'id="daily-pick-label"' in html and "OFFERTA DEL GIORNO" in html,
                      "price_badge": "savings-badge" in html,
                      "selected_offer_html": selected["product_url"] in html,
                      "json_generated_at": public.get("generated_at") == generated,
                      "json_daily_pick": public.get("daily_pick_id") == chosen,
                      "json_comparisons": sum("comparison_savings_pct" in o for o in public.get("offers", [])) == expected_comparisons,
                      "json_offers": public.get("offers") == expected.get("offers"),
                  }
                  print(json.dumps({"attempt": attempt, "expected_generated_at": generated,
                                    "public_generated_at": public.get("generated_at"),
                                    "checks": checks}, ensure_ascii=False), flush=True)
                  if all(checks.values()):
                      print("Public homepage and JSON match the GitHub snapshot.")
                      break
              except Exception as exc:
                  print(json.dumps({"attempt": attempt, "error": str(exc), "type": type(exc).__name__}), flush=True)
              if attempt < 12:
                  time.sleep(20)
          else:
              print("::error::PUBLICATION_LAG: homepage or /data/home.json did not match the GitHub snapshot after 12 attempts (~4 minutes).")
              sys.exit(1)
          PY

      - name: Verify published feature CSS
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          url='https://offerte4zampe.it/assets/style.css'
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'Offerte4Zampe-Public-Release-Check/1.0'})
              with urllib.request.urlopen(request,timeout=15) as response:
                  content=response.read(500000).decode('utf-8','replace')
              checks={
                  'spotlight_big_layout':'.daily-pick .spotlight-product.has-price-proof' in content,
                  'large_price':'font-size:clamp(36px,4vw,50px)' in content,
                  'responsive_mobile':'@media(max-width:520px)' in content,
                  'reduced_motion':'prefers-reduced-motion:reduce' in content
              }
              print(json.dumps({'css_url':url,'checks':checks}))
              if not all(checks.values()):
                  print('::warning::Latest daily offer CSS is not yet visible on public site.')
          except urllib.error.HTTPError as err:
              print(json.dumps({'css_url':url,'http_status':err.code,'verification':'unavailable'}))
              print('::warning::Public CSS check blocked by HTTP error.')
          except Exception as err:
              print(json.dumps({'css_url':url,'verification':'unavailable','kind':type(err).__name__}))
              print('::warning::Public CSS check failed.')
          PY

      - name: Check public seasonal assets (read-only)
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          for name,marker in [
              ('seasonal-theme.mjs','black-week-hero.svg'),
              ('seasonal-theme.css','o4z-season-visual'),
              ('base.js','seasonal-theme.mjs'),
              ('black-week-hero.svg','Black Week a quattro zampe'),
              ('christmas-hero.svg','Natale a quattro zampe')]:
              url='https://offerte4zampe.it/assets/'+name
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Offerte4Zampe-Public-Release-Check/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      body=response.read(150000).decode('utf-8','replace')
                      status=response.status
                  visible=status==200 and marker in body
                  print(json.dumps({'asset':name,'status':status,'expected_content_visible':visible}))
                  if not visible:print('::warning::Seasonal asset is not yet deployed')
              except urllib.error.HTTPError as e:
                  print(json.dumps({'asset':name,'http_status':e.code,'result':'blocked_or_not_published'}))
                  print('::warning::Seasonal asset inaccessible from GitHub runner')
              except Exception as e:
                  print(json.dumps({'asset':name,'result':'unavailable','kind':type(e).__name__}))
                  print('::warning::Seasonal asset verification unavailable')
          PY

      - name: Verify Instagram Facebook Telegram links in published homepage
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          urls={
            'instagram':'https://www.instagram.com/offerte4zampe/',
            'facebook':'https://www.facebook.com/1459528943903012',
            'telegram':'https://t.me/sconti4zampe'
          }
          request=urllib.request.Request('https://offerte4zampe.it/',headers={'User-Agent':'Offerte4Zampe-Public-Release-Check/1.0'})
          try:
            with urllib.request.urlopen(request,timeout=15) as response:
              html=response.read(1000000).decode('utf-8','replace')
            result={'social_home': 'class="social-follow-section"' in html,
                    'social_header': 'class="header-socials"' in html,
                    'social_mobile': 'class="mobile-socials"' in html,
                    'social_footer': 'class="footer-socials"' in html,
                    'profiles': {k:html.count('href="'+v+'"') for k,v in urls.items()}}
            print(json.dumps(result))
            if not all(result[k] for k in ('social_home','social_header','social_mobile','social_footer')) or not all(n>=4 for n in result['profiles'].values()):
              print('::warning::Social links not fully visible in current public homepage.')
          except Exception as e:
            print(json.dumps({'check':'social_links','status':'unavailable','type':type(e).__name__}))
            print('::warning::Public homepage is not readable from this runner.')
          PY
