name: Phase 2 isolated Cloudflare preview
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: phase2-isolated-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'phase2/shipping-metadata-preview-20261104' &&
      (github.event.action != 'labeled' || github.event.label.name == 'phase2-preview-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-staging
    env:
      PREVIEW_NAME: phase2-${{ github.event.pull_request.number }}
    steps:
      - name: Check out the exact same-repository PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed build tools without Cloudflare credentials
        run: |
          python -m pip install Pillow==12.3.0
          npm install --global wrangler@4.154.0
          npm install --prefix "$RUNNER_TEMP/phase2-browser" puppeteer-core@25.14.0
      - name: Prepare JSON-only build
        run: python automation/check_d1_activation.py --prepare-build
      - name: Build the isolated configuration locally without upload
        run: |
          wrangler deploy --dry-run --config wrangler.phase2-preview.jsonc --outdir /tmp/phase2-preview-build > preview-build.log 2>&1
      - name: Run the complete Python suite
        run: python -m unittest discover -s tests > preview-python-tests.log 2>&1
      - name: Run the complete Node suite
        run: node --test tests/test_*.mjs > preview-node-tests.log 2>&1
      - name: Verify shipping matrix on local workerd before any remote upload
        run: python automation/verify_d1_staging.py --wrangler "$(command -v wrangler)" > preview-workerd-tests.log 2>&1
      - name: Upload native preview only
        if: github.event.action == 'labeled' && github.event.label.name == 'phase2-preview-approved'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare staging credentials are not configured; no preview upload was attempted.'
            exit 1
          fi
          wrangler preview --config wrangler.phase2-preview.jsonc --ignore-base-config --name "$PREVIEW_NAME" --json > preview-upload.json
      - name: Validate the isolated preview URL
        if: github.event.action == 'labeled' && github.event.label.name == 'phase2-preview-approved'
        id: preview_url
        run: python automation/phase2_preview_url.py preview-upload.json --expected "$PREVIEW_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify preview in real Chromium without external merchant navigation
        if: github.event.action == 'labeled' && github.event.label.name == 'phase2-preview-approved'
        env:
          PREVIEW_ORIGIN: ${{ steps.preview_url.outputs.url }}
        run: |
          export PUPPETEER_ROOT="$RUNNER_TEMP/phase2-browser"
          export CHROME_PATH="$(command -v google-chrome)"
          node tests/check_phase2_preview.mjs > preview-browser-tests.log 2>&1
      - name: Preserve preview output and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-preview-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            preview-upload.json
            preview-build.log
            preview-python-tests.log
            preview-node-tests.log
            preview-workerd-tests.log
            staging-reports/local-shipping-report.json
            preview-browser-tests.log
            browser-reports/phase2/
          if-no-files-found: warn
          retention-days: 7
