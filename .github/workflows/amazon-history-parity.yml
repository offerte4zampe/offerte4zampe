name: Amazon history real-snapshot parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/update_history.py'
      - 'tests/test_history.py'
      - '.github/workflows/amazon-history-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Compare real repository snapshot on main and PR offline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          git worktree add --detach "$RUNNER_TEMP/amazon-history-main" "$BASE"
          BASE_DIR="$RUNNER_TEMP/amazon-history-main" PR_DIR="$GITHUB_WORKSPACE" python - <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess
          base=pathlib.Path(os.environ['BASE_DIR'])
          pr=pathlib.Path(os.environ['PR_DIR'])
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def files(root):
              return {str(p.relative_to(root/'site')):sha(p) for p in (root/'site').rglob('*.html')} | {str(p.relative_to(root/'site')):sha(p) for p in (root/'site').glob('sitemap*.xml')}
          def load(root,name):
              return json.loads(gzip.decompress((root/'site/data'/name).read_bytes()))
          # Prove the inputs really are the exact same tracked snapshot.
          for path in ['site/data/catalog.json.gz','site/data/price-history.json.gz','automation/product-registry.json']:
              assert sha(base/path)==sha(pr/path),f'Input snapshot mismatch: {path}'
          tracked_before=files(base)
          assert tracked_before==files(pr),'Tracked HTML/sitemaps differ before build'
          catalog=load(pr,'catalog.json.gz')
          assert len(catalog['offers'])>100,'Real snapshot missing; refusing fixture-only parity'
          # Freeze wall clock for both builds: sitemap lastmod must not drift
          # merely because the two offline invocations run seconds apart.
          clock_dir=pathlib.Path(os.environ['RUNNER_TEMP'])/'frozen-clock'
          clock_dir.mkdir(parents=True,exist_ok=True)
          import datetime
          fixed_now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          (clock_dir/'sitecustomize.py').write_text(
              'import datetime as _d, os as _o\n'
              '_real=_d.datetime\n'
              'class _Frozen(_real):\n'
              ' @classmethod\n'
              ' def now(cls, tz=None):\n'
              '  instant=_real.fromisoformat(_o.environ["SNAPSHOT_FIXED_NOW"])\n'
              '  return instant.astimezone(tz) if tz is not None else instant.replace(tzinfo=None)\n'
              ' @classmethod\n'
              ' def utcnow(cls):\n'
              '  return cls.now(_d.timezone.utc).replace(tzinfo=None)\n'
              '_d.datetime=_Frozen\n')
          # Offline compatibility check only: exercise preserved non-Amazon history.
          # Production defaults remain false; the separate safety job audits the disabled build.
          env={**os.environ,'PRICE_TRACKING_ENABLED':'true','SNAPSHOT_FIXED_NOW':fixed_now,
               'PYTHONPATH':str(clock_dir)+os.pathsep+os.environ.get('PYTHONPATH','')}
          for root in [base,pr]:
              for cmd in [
                  ['python','automation/update_history.py'],
                  ['python','automation/build_product_catalog.py'],
                  ['python','automation/build_product_pages.py'],
                  ['python','automation/build_home_data.py'],
                  ['python','automation/build_sitemaps.py'],
              ]:
                  subprocess.run(cmd,cwd=root,check=True,env=env)
          assert sha(base/'site/data/catalog.json.gz')==sha(pr/'site/data/catalog.json.gz'),'Merchant offers snapshot changed'
          base_model=load(base,'product-catalog.json.gz')
          pr_model=load(pr,'product-catalog.json.gz')
          assert base_model['offers']==pr_model['offers'],'Canonical merchant offers changed'
          old_history=load(base,'price-history.json.gz')['offers']
          new_history=load(pr,'price-history.json.gz')['offers']
          merchant_by_id={o['id']:str(o.get('merchant_id') or o.get('merchant') or '').lower() for o in catalog['offers']}
          for oid,rows in old_history.items():
              if merchant_by_id.get(oid) not in ('amazon','amazon.it','amazon_italy'):
                  assert new_history.get(oid)==rows,f'Non-Amazon history changed: {oid}'
          actual=files(pr)
          before=files(base)
          changes=[p for p in sorted(set(actual)|set(before)) if actual.get(p)!=before.get(p)]
          assert not changes,f'Generated HTML/sitemap parity failure, first 20: {changes[:20]}'
          summary=(f'## Real snapshot parity\n- Catalog offers: {len(catalog["offers"])}\n- Canonical offers identical: {len(pr_model["offers"])}\n- HTML and sitemap files identical byte-for-byte: {len(actual)}\n- Non-Amazon observed history: unchanged\n')
          print(summary)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(summary)
          PY
